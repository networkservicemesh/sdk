---
name: ci
on:
  pull_request:
  push:
    branches:
      - "release/**"
jobs:
  yamllint:
    uses: networkservicemesh/.github/.github/workflows/yamllint.yaml@main

  build-and-test:
    uses: networkservicemesh/.github/.github/workflows/build-and-test.yaml@main
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'

  golangci-lint:
    uses: networkservicemesh/.github/.github/workflows/golangci-lint.yaml@main
    with:
      linter-version: v1.64.2

  exclude-fmt-errorf:
    uses: networkservicemesh/.github/.github/workflows/exclude-fmt-errorf.yaml@main

  restrict-nsm-deps:
    uses: networkservicemesh/.github/.github/workflows/restrict-nsm-deps.yaml@main
    with:
      allowed_repositories: "api"

  checkgomod:
    uses: networkservicemesh/.github/.github/workflows/checkgomod.yaml@main

  # TODO: revert to the reusable workflow once GitHub's cache for
  # networkservicemesh/.github@main picks up the repo-token fix for
  # arduino/setup-protoc (see networkservicemesh/.github#95).
  gogenerate:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          version: "3.8.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.3
      - name: Install proto-gen-go
        run: go install github.com/golang/protobuf/protoc-gen-go@v1.4.2
      - name: Install go-syncmap
        run: go install github.com/searKing/golang/tools/cmd/go-syncmap@v1.1.68
      - name: Generate files
        run: go generate ./...
      - name: Check for changes in generated code
        run: |
          git diff -- '*.pb.go' || ( echo "Rerun go generate ./... locally and resubmit" && false )
          git diff -- '*.gen.go' || ( echo "Rerun go generate ./... locally and resubmit" && false )

  exclude-replace:
    uses: networkservicemesh/.github/.github/workflows/exclude-replace.yaml@main

  code-cov:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.1
      - run: |
          go test -coverprofile=coverage-${{ matrix.os }}.txt -covermode=atomic -race ./...
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
